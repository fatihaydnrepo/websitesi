version: 2.1

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build
      - push:
          requires:
            - build
      - deploy:
          requires:
            - push

jobs:
  build:
    docker:
      - image: cimg/python:3.8
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build Docker Image
          command: |
            docker build -t $DOCKER_USERNAME/devopswebsite:$CIRCLE_SHA1 .
            docker tag $DOCKER_USERNAME/devopswebsite:$CIRCLE_SHA1 $DOCKER_USERNAME/devopswebsite:latest
      - run:
          name: Save and Push Docker Image
          command: |
            echo $DOCKER_PASSWORD | docker login --username $DOCKER_USERNAME --password-stdin
            docker push $DOCKER_USERNAME/devopswebsite:$CIRCLE_SHA1
            docker push $DOCKER_USERNAME/devopswebsite:latest

  push:
    docker:
      - image: cimg/python:3.8
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Push Latest Tag
          command: |
            echo $DOCKER_PASSWORD | docker login --username $DOCKER_USERNAME --password-stdin
            docker pull $DOCKER_USERNAME/devopswebsite:$CIRCLE_SHA1
            docker tag $DOCKER_USERNAME/devopswebsite:$CIRCLE_SHA1 $DOCKER_USERNAME/devopswebsite:latest
            docker push $DOCKER_USERNAME/devopswebsite:latest

  deploy:
    docker:
      - image: alpine/helm:3.12.0
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            apk add --update --no-cache curl python3 py3-pip
            pip install google-cloud-sdk
      - run:
          name: Setup Google Cloud CLI
          command: |
            echo $GCLOUD_SERVICE_KEY > ${HOME}/gcloud-service-key.json
            gcloud auth activate-service-account --key-file=${HOME}/gcloud-service-key.json
            gcloud config set project ${GOOGLE_PROJECT_ID}
            gcloud config set compute/zone ${GOOGLE_COMPUTE_ZONE}
            gcloud container clusters get-credentials ${GOOGLE_CLUSTER_NAME}
      - run:
          name: Deploy to GKE with Helm
          command: |
            # Helm repo update
            helm repo update
            
            # Deploy/Upgrade Helm chart
            helm upgrade --install devops-website ./chart \
              --set image.repository=$DOCKER_USERNAME/devopswebsite \
              --set image.tag=$CIRCLE_SHA1 \
              --namespace default \
              --wait \
              --timeout 5m0s
