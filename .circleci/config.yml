version: 2.1

# Workflows kısmı, iş akışlarını tanımlar
workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - push:
          requires:
            - test

# Jobs kısmı, her adımda yapılacak işlemleri tanımlar
jobs:
  # Docker image build işlemi
  build:
    docker:
      - image: nginx:alpine
    steps:
      - checkout  # Kodunuzu çekin
      - run:
          name: Build Docker Image
          command: |
            docker build -t reptilianusbileciktus/devopswebsite:$CIRCLE_SHA1 .  # Docker image'ı SHA hash ile etiketleyerek oluşturuyoruz
      - run:
          name: Tag Docker Image
          command: |
            docker tag reptilianusbileciktus/devopswebsite:$CIRCLE_SHA1 reptilianusbileciktus/devopswebsite:latest  # Docker imajına "latest" etiketi ekliyoruz
          
  # Docker image üzerinde test işlemi
  test:
    docker:
      - image: nginx:alpine # Test için de uygun bir imaj kullanabilirsiniz
    steps:
      - checkout  # Kodunuzu çekin
      - run:
          name: Test Docker Image
          command: |
            docker run --rm reptilianusbileciktus/devopswebsite:$CIRCLE_SHA1 websitetest  # Docker imajınızı çalıştırıp testleri başlatıyoruz

  # Docker image'ı registry'e push etmek
  push:
    docker:
      - image: nginx:alpine  # Yine uygun bir base image kullanıyoruz
    steps:
      - checkout  # Kodunuzu çekin
      - setup_remote_docker:
          version: 20.10.7  # Docker'ı düzgün çalıştırabilmek için gerekli ortamı kuruyoruz
      - run:
          name: Log in to DockerHub
          command: |
            echo $DOCKER_PASSWORD | docker login --username $DOCKER_USERNAME --password-stdin  # Docker Hub'a giriş yapıyoruz
      - run:
          name: Push Docker Image
          command: |
            docker push reptilianusbileciktus/devopswebsite:$CIRCLE_SHA1  # Oluşturduğumuz imajı registry'e push ediyoruz
            docker push reptilianusbileciktus/devopswebsite:latest  # Latest etiketi ile push ediyoruz
