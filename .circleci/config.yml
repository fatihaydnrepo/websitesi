version: 2.1

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build
      - push:
          requires:
            - build
      - deploy:
          requires:
            - push
      - notify:
          requires:
            - deploy

jobs:
  build:
    docker:
      - image: cimg/python:3.8
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build Docker Image
          command: |
            docker build -t $DOCKER_USERNAME/devopswebsite:$CIRCLE_SHA1 .
            docker tag $DOCKER_USERNAME/devopswebsite:$CIRCLE_SHA1 $DOCKER_USERNAME/devopswebsite:latest
      - run:
          name: Save and Push Docker Image
          command: |
            echo $DOCKER_PASSWORD | docker login --username $DOCKER_USERNAME --password-stdin
            docker push $DOCKER_USERNAME/devopswebsite:$CIRCLE_SHA1
            docker push $DOCKER_USERNAME/devopswebsite:latest

  push:
    docker:
      - image: cimg/python:3.8
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Push Latest Tag
          command: |
            echo $DOCKER_PASSWORD | docker login --username $DOCKER_USERNAME --password-stdin
            docker pull $DOCKER_USERNAME/devopswebsite:$CIRCLE_SHA1
            docker tag $DOCKER_USERNAME/devopswebsite:$CIRCLE_SHA1 $DOCKER_USERNAME/devopswebsite:latest
            docker push $DOCKER_USERNAME/devopswebsite:latest

  deploy:
    docker:
      - image: google/cloud-sdk:latest
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            apt-get update && apt-get install -y curl python3-pip bash tar google-cloud-cli-gke-gcloud-auth-plugin kubectl
            echo $GCLOUD_SERVICE_KEY > /root/gcloud-service-key.json
            gcloud auth activate-service-account --key-file=/root/gcloud-service-key.json --quiet
            gcloud config set project websitesi-450615 --quiet
            
            # Kubernetes ve Helm Kurulumu
            curl https://get.helm.sh/helm-v3.9.1-linux-amd64.tar.gz -o helm.tar.gz
            tar -xvzf helm.tar.gz
            mv linux-amd64/helm /usr/local/bin/helm
            helm repo add bitnami https://charts.bitnami.com/bitnami --force-update
            helm repo update
  
            # GKE Auth Plugin Yükleme
            export USE_GKE_GCLOUD_AUTH_PLUGIN=True
            
            # Kubernetes Erişimi Test Et
            gcloud container clusters get-credentials website --region europe-west2 --project websitesi-450615 --quiet
            kubectl cluster-info
            
      - run:
          name: Verify gcloud installation
          command: |
            gcloud --version  # SDK'nın doğru yüklendiğini kontrol edin
            helm version
      - run:
          name: Setup Google Cloud CLI
          command: |
            echo $GCLOUD_SERVICE_KEY > /root/gcloud-service-key.json
            gcloud auth activate-service-account --key-file=/root/gcloud-service-key.json
            gcloud config set project ${GOOGLE_PROJECT_ID}
            gcloud config set compute/zone europe-west2
            gcloud container clusters get-credentials ${GOOGLE_CLUSTER_NAME}

      - run:
          name: Deploy to GKE with Helm
          command: |
            # Helm repo update
            helm repo update
            
            # Deploy/Upgrade Helm chart
            helm upgrade --install devops-website ./chart \
              --set image.repository=$DOCKER_USERNAME/devopswebsite \
              --set image.tag=$CIRCLE_SHA1 \
              --namespace default \
              --wait \
              --timeout 5m0s

  notify:
    docker:
      - image: cimg/python:3.8
    steps:
      - run:
          name: Install dependencies
          command: pip install requests
      - run:
          name: Send email via SendGrid
          command: |
            curl --request POST \
              --url https://api.sendgrid.com/v3/mail/send \
              --header "Authorization: Bearer ${SENDGRID_API_KEY}" \
              --header "Content-Type: application/json" \
              --data '{
                "personalizations": [{
                  "to": [{"email": "devopsfatihh@gmail.com"}],
                  "subject": "Deploy Tamamlandı: DevOps Website"
                }],
                "from": {"email": "fatih_aydn@outlook.com"},
                "content": [{"type": "text/plain", "value": "Yeni sürüm başarıyla deploy edildi. SHA: '"$CIRCLE_SHA1"'"}]
              }'
