deploy: 
  name: devopswebsite
  env: 
  replicas: 1
  port: 80
  targetport: 80
  image: reptilianusbileciktus/devopswebsite
  tag: latest
  resources:
    enabled: false
    requestCpu: "100Mi"
    requestMemory: "250m"
    limitCpu: "200Mi"
    limitMemory: "500m"
svc:
  enabled: true
  name: devopswebsite
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: fatihayd.in
      paths:
        - path: /
          pathType: Prefix
          serviceName: devopswebsite
          servicePort: 80
  tls:
    - secretName: fatih-tls
      hosts:
        - fatihayd.in
hpa:
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 65
probe:
  enabled: false
  failureThreshold: 
  periodSeconds: 
  timeoutSeconds: 
  initialDelaySeconds: 
  pathreadiness: 
  pathliveness: 
  port: 
ingress:
  enabled: false
  hosts: 
  customAnnotations:
    enabled: true
    kubernetes.io/ingress.class: 
  defaultPath: /
  pathType: Prefix
configmap:
  enabled: false
  name: 
appconfigs:
  configmap:
    enabled: false
volumeMounts:
  enabled: false
  pathOnContainer: 
  pathOnHost: 
secrets:
  enabled: false
  secretName:  
externalSecret:
  enabled: false
  targetName: 
nfs:
  enabled: false
  name: 
  mountPath: 
  claimName: 
imagePullSecrets:
  - name: docker-hub-secret
