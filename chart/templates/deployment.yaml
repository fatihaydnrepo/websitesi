apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deploy.name }}-deployment
  labels:
    app: {{ .Values.deploy.name }}
    tags.datadoghq.com/service: {{ .Values.deploy.name }}
spec:
  replicas: {{ .Values.deploy.replicas }}
{{- if .Values.deploy.strategy }}  
  strategy:    
{{ toYaml .Values.deploy.strategy | indent 4 }}
{{- end }}               
  selector:
    matchLabels:
      app: {{ .Values.deploy.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.deploy.name }}
    spec:
      imagePullSecrets:
      - name: docker-hub-secret
      containers:
      - name: {{ .Values.deploy.name }}
{{- if or (eq .Values.configmap.enabled true) (eq .Values.secrets.enabled true) }}
        envFrom:
    {{- if .Values.configmap.enabled }}
        - configMapRef:
            name: {{ .Values.configmap.name }}
    {{- end }}
    {{- if and (eq .Values.secrets.enabled true) (ne .Values.externalSecret.mount true)}}
        - secretRef:
            name: {{ .Values.secrets.secretName }}
    {{- end }}
{{- end }}
        image: {{ .Values.deploy.image }}:{{ .Values.deploy.tag }}
        imagePullPolicy: Always
{{- if .Values.deploy.resources.enabled }}
        resources:
          requests:
            cpu: {{ .Values.deploy.resources.requestCpu }}
            memory: {{ .Values.deploy.resources.requestMemory }}
          limits:
            cpu: {{ .Values.deploy.resources.limitCpu }}
            memory: {{ .Values.deploy.resources.limitMemory }}
{{- end }}
{{- if .Values.probe.enabled }}
        readinessProbe:
          httpGet:
            path: {{ .Values.probe.pathreadiness }}
            port: {{ .Values.probe.port }}  
          initialDelaySeconds: {{ .Values.probe.initialDelaySeconds }}
          timeoutSeconds: {{ .Values.probe.timeoutSeconds }}
        livenessProbe:
          httpGet:
            path: {{ .Values.probe.pathliveness }}
            port: {{ .Values.probe.port }} 
          failureThreshold: {{ .Values.probe.failureThreshold }}
          periodSeconds: {{ .Values.probe.periodSeconds }}
          initialDelaySeconds: {{ .Values.probe.initialDelaySeconds }}
          timeoutSeconds: {{ .Values.probe.timeoutSeconds }}
{{- end }}
        {{- if or (eq .Values.volumeMounts.enabled true) (eq .Values.externalSecret.mount true) }}
        volumeMounts:
        - mountPath: {{ .Values.externalSecret.mountPath }}
          name: confmount
        {{- end }}
        {{- if .Values.nfs.enabled }}
        - mountPath: {{ .Values.nfs.mountPath }} 
          name: {{ .Values.nfs.name }} 
        {{- end }}
        ports:
        - containerPort: {{ .Values.deploy.port }}
      restartPolicy: Always
{{- if or (eq .Values.volumeMounts.enabled true) (eq .Values.externalSecret.mount true) }}
      volumes:
      {{- if .Values.nfs.enabled }}
      - name: {{ .Values.nfs.name }} 
        persistentVolumeClaim:
          claimName: {{ .Values.nfs.claimName }} 
      {{- end }}     
      {{- if .Values.volumeMounts.enabled }}
      - name: confmount
        hostPath:
          path: {{ .Values.volumeMounts.pathOnHost}}
          type: Directory
      {{- else if .Values.externalSecret.mount }}
      - name: confmount
        secret:
          secretName: {{ .Values.externalSecret.targetName}}
          defaultMode: 420
      {{- end }}
{{- end }}
