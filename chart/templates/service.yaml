{{- if .Values.svc.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.svc.name }}
spec:
  selector:
    app: {{ .Values.deploy.name }}
  type: ClusterIP
  ports:
    - protocol: TCP
      name: port1
      port: 80
      targetPort: {{ .Values.deploy.targetport }}
    {{- end }}
{{- end }}
